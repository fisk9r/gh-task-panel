name: stock-analysis 跨仓库救援（独立 schedule 队列）

# 第 4 层兜底（2026-09-06 #521，v2 修复 YAML 断裂）：stock-analysis 仓库的 schedule
# 被整体漏投时（周日 20:00 周末发酵三重订阅全漏的教训），本仓库的 cron 仍在独立
# 队列里，由它跨仓库检查 push_log 并补派缺失任务。
# 去重依据 = 当日该 mode 是否已推送（读 stock-analysis Release 的 state.tar.gz）。
# 注意：run 块内嵌 python 一律用 <<'PY' heredoc 且与块基础缩进对齐（v1 教训：
# 顶格多行字符串会截断 YAML 字面量块，工作流直接解析失败）。
on:
  schedule:
    - cron: '12 20 * * 0'    # 北京 20:12 周日 周末发酵（主 20:00）
    - cron: '12 0 * * 1'     # 北京 08:12 周一 周末发酵（主 08:00）
    - cron: '10 1 * * 1-5'   # 北京 09:10 盘前（主 08:50 / 外部 08:45）
    - cron: '31 1 * * 1-5'   # 北京 09:31 竞价（主 09:25 / 外部 09:20）
    - cron: '5 8 * * 1-5'    # 北京 16:05 收盘完整分析（主 15:20 / 外部 15:15）
    - cron: '15 12 * * 1-5'  # 北京 20:15 复盘补发（主 20:00 / 外部 19:55）

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检查缺失并跨仓库补派
        env:
          PAT: ${{ secrets.GH_RESCUE_PAT }}
          TZ: Asia/Shanghai
        run: |
          set -e
          DOW=$(date +%u); HM=$(date +%H%M); HM=$((10#$HM))
          if [ "$DOW" = "7" ]; then
            if [ "$HM" -ge 2005 ] && [ "$HM" -le 2130 ]; then
              MODE=weekend; TASK=weekend
            else
              echo "非救援窗口"; exit 0
            fi
          elif [ "$DOW" = "1" ] && [ "$HM" -ge 805 ] && [ "$HM" -le 840 ]; then
            MODE=weekend; TASK=weekend
          elif [ "$HM" -ge 905 ] && [ "$HM" -le 925 ]; then
            MODE=preauction; TASK=preauction
          elif [ "$HM" -ge 926 ] && [ "$HM" -le 944 ]; then
            MODE=auction; TASK=auction
          elif [ "$HM" -ge 1550 ] && [ "$HM" -le 1730 ]; then
            MODE=close; TASK=build
          elif [ "$HM" -ge 2010 ] && [ "$HM" -le 2130 ]; then
            MODE=close_again; TASK=close_again
          else
            echo "非救援窗口"; exit 0
          fi
          echo "窗口判定：mode=$MODE task=$TASK（北京 $(date '+%H:%M') 周$DOW）"

          mkdir -p /tmp/xr && cd /tmp/xr
          ASSET_JSON=$(curl -s -H "Authorization: Bearer $PAT" \
            https://api.github.com/repos/fisk9r/stock-analysis/releases/tags/data-snapshot)
          ASSET_ID=$(printf '%s' "$ASSET_JSON" | python3 - <<'PY'
          import json, sys
          d = json.load(sys.stdin)
          for a in d.get("assets", []):
              if a["name"] == "state.tar.gz":
                  print(a["id"])
                  break
          PY
          )
          [ -n "$ASSET_ID" ] || { echo "找不到 state.tar.gz 资产"; exit 0; }
          curl -sL -H "Authorization: Bearer $PAT" -H "Accept: application/octet-stream" \
            -o state.tar.gz "https://api.github.com/repos/fisk9r/stock-analysis/releases/assets/$ASSET_ID"
          tar xzf state.tar.gz 2>/dev/null
          [ -f dist/push_log.jsonl ] || { echo "状态包缺失，退出"; exit 0; }
          TODAY=$(date +%F)
          HIT=$(python3 - "$MODE" "$TODAY" <<'PY'
          import json, sys
          mode, today = sys.argv[1], sys.argv[2]
          hit = 0
          for line in open("dist/push_log.jsonl", encoding="utf-8"):
              try:
                  p = json.loads(line)
                  if str(p.get("ts", "")).startswith(today) and p.get("mode") == mode:
                      hit = 1
                      break
              except Exception:
                  pass
          print(hit)
          PY
          )
          if [ "$HIT" = "1" ]; then echo "  ✔ $MODE 今日已推送，跳过"; exit 0; fi
          echo "  → 跨仓库补派 task=$TASK"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fisk9r/stock-analysis/actions/workflows/stock.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"task\":\"$TASK\"}}")
          echo "  dispatch HTTP $code（204=已触发）"
